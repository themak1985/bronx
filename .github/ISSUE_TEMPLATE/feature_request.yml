name: Feature request
description: Suggest a reusable CiviCRM component or accessibility improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the public CiviCRM workflow and who benefits.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: portability
    attributes:
      label: CMS and portability considerations
      description: Explain whether this uses standard CiviCRM markup or a third-party extension.
