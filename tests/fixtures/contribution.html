<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bronx contribution form coverage</title>
  <style>
    :root {
      --crm-text-color: #243043;
      --crm-inactive-color: #64748b;
      --crm-danger-color: #b42318;
      --crm-info-color: #1769aa;
      --crm-info-light-color: #eaf5ff;
      --crm-info-ink-color: #12344d;
      --crm-input-border: 1px solid var(--crm-input-border-color);
      --crm-input-bg-color: #fff;
      --crm-input-color: #172033;
    }
    body { margin: 0; padding: 30px; color: var(--crm-text-color); font: 16px/1.5 system-ui, sans-serif; }
    .fixture-cms-column { inline-size: min(80%, 70rem); margin-inline: auto; }
  </style>
  <link rel="stylesheet" href="../../streams/bronx/_main.css">
</head>
<body>
<div class="fixture-cms-column">
<div id="crm-container" class="crm-container crm-public">
<div id="crm-main-content-wrapper">
  <form id="Main" class="CRM_Contribute_Form_Contribution_Main">
    <div class="crm-block crm-contribution-main-form-block">
      <div id="intro_text" class="crm-public-form-item crm-section intro_text-section">
        <p>Please consider making a tax-deductible donation.</p>
      </div>

      <div id="priceset-div">
        <div id="priceset" class="crm-section price_set-section">
          <div class="crm-section contribution_amount-section crm-price-field-id-155">
            <div class="label"><label>Contribution Amount</label></div>
            <div class="content contribution_amount-content">
              <div class="price-set-row contribution_amount-row1"><span class="price-set-option-content"><span class="crm-option-label-pair"><input id="amount-25" class="crm-form-radio" type="radio" name="price_155"><label for="amount-25"><span class="crm-price-amount-amount">$25.00</span></label></span></span></div>
              <div class="price-set-row contribution_amount-row2"><span class="price-set-option-content"><span class="crm-option-label-pair"><input id="amount-50" class="crm-form-radio" type="radio" name="price_155" checked><label for="amount-50"><span class="crm-price-amount-amount">$50.00</span></label></span></span></div>
              <div class="price-set-row contribution_amount-row3"><span class="price-set-option-content"><span class="crm-option-label-pair"><input id="amount-other" class="crm-form-radio" type="radio" name="price_155"><label for="amount-other"><span class="crm-price-amount-label">Other Amount</span></label></span></span></div>
            </div>
          </div>

          <div class="crm-section other_amount-section crm-price-field-id-154">
            <div class="label"><label for="price_154">Other Amount</label></div>
            <div class="content">$ <input id="price_154" class="crm-form-text" type="text" inputmode="decimal"></div>
          </div>

          <div id="pricesetTotal" class="crm-section section-pricesetTotal hiddenElement">
            <div class="label">Total Amount</div><div class="content">$0.00</div>
          </div>
        </div>
      </div>

      <fieldset class="crm-profile">
        <legend>Your Info</legend>
        <div class="crm-section form-item">
          <div class="label"><label for="first_name">First Name <span class="crm-marker">*</span></label></div>
          <div class="content"><input id="first_name" class="big crm-form-text required" type="text"></div>
        </div>
      </fieldset>

      <div class="crm-submit-buttons"><button class="crm-button" type="button"><i class="crm-i fa-check">✓</i> Contribute</button></div>
    </div>
  </form>
</div>
</div>
</div>
</body>
</html>
